[package]
name = "commit-review"
version = "0.1.0"
edition = "2021"
description = "Human review gate before a commit started by Claude Code"

[dependencies]
blit = { git = "https://github.com/nicoburniske/blit" }
blit-desktop = { git = "https://github.com/nicoburniske/blit", default-features = false, features = [
  "gpu",
] }
blit-gui = { git = "https://github.com/nicoburniske/blit" }
blit-text = { git = "https://github.com/nicoburniske/blit" }
blit-text-cosmic = { git = "https://github.com/nicoburniske/blit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
itoa = "1"
syntect = { version = "5.3", default-features = false, features = [
  "default-syntaxes",
  "regex-fancy",
] }

[profile.release]
strip = true
